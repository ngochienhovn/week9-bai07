name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Thay đổi ở đây: Cấp quyền write để upload dependency graph
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run Maven
        run: mvn clean install

      # Thêm bước này nếu bạn muốn tự động cập nhật Dependency Graph 
      # (Bước mà bạn đã chạy và bị lỗi 403 lúc nãy)
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v1
